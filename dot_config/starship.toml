# ~/.config/starship.toml
# Noctalia manages the `palette = "noctalia"` line and the marker block at the
# bottom of this file directly (see template-apply.sh). Everything else here is
# hand-maintained and safe to edit — Noctalia won't touch it.
palette = "noctalia"

# Two-line layout. The (╭─/╰─) corners + arrow on the second line.
format = """
[╭─](blue) $directory$git_branch$git_status
[╰─](blue)$character"""

# Show the last 3 path components. truncate_to_repo must be false, else a git
# repo root collapses to just its own name regardless of truncation_length.
[directory]
truncation_length = 3
truncate_to_repo = false
truncation_symbol = ".../"
style = "blue"

[git_branch]
symbol = " "          # Nerd Font git glyph
style = "yellow"
format = "[$symbol$branch]($style)"

[git_status]
# '*' when dirty, matching your bash version (drop these lines for richer default markers)
style = "yellow"
format = "[$all_status$ahead_behind]($style)"
modified = "*"
staged = "*"

# Exit-status-colored arrow: blue on success, red on failure
[character]
success_symbol = "[→](blue)"
error_symbol = "[→](red)"







































