# ~/.config/starship.toml
# Noctalia manages the `palette = "noctalia"` line and the marker block at the
# bottom of this file directly (see template-apply.sh). Everything else here is
# hand-maintained and safe to edit — Noctalia won't touch it.
palette = "noctalia"

# Two-line layout. The (╭─/╰─) corners + arrow on the second line.
format = """
[╭─](blue) $directory$git_branch$git_status
[╰─](blue)$character"""

# Show the last 3 path components. truncate_to_repo must be false, else a git
# repo root collapses to just its own name regardless of truncation_length.
[directory]
truncation_length = 3
truncate_to_repo = false
truncation_symbol = ".../"
style = "blue"

[git_branch]
symbol = " "          # Nerd Font git glyph
style = "yellow"
format = "[$symbol$branch]($style)"

[git_status]
# '*' when dirty, matching your bash version (drop these lines for richer default markers)
style = "yellow"
format = "[$all_status$ahead_behind]($style)"
modified = "*"
staged = "*"

# Exit-status-colored arrow: blue on success, red on failure
[character]
success_symbol = "[→](blue)"
error_symbol = "[→](red)"

# >>> NOCTALIA STARSHIP PALETTE >>>
# Noctalia Starship Palette (predefined colorscheme)
# Generated by Noctalia - do not edit manually

[palettes.noctalia]
# Standard colors
blue      = "#67b0e8"
red       = "#e57474"
green     = "#8ccf7e"
yellow    = "#e5c76b"
cyan      = "#6cbfbf"
magenta   = "#c47fd5"
white     = "#b3b9b8"
black     = "#232a2d"

# Extended palette (Catppuccin-compatible names)
rosewater = "#f4d67a"
flamingo  = "#ef7e7e"
pink      = "#ce89df"
mauve     = "#c47fd5"
maroon    = "#ef7e7e"
peach     = "#f4d67a"
teal      = "#6cbfbf"
sky       = "#67cbe7"
sapphire  = "#71baf2"
lavender  = "#ce89df"

# Text shades
text      = "#dadada"
subtext1  = "#b3b9b8"
subtext0  = "#464e50"

# Surface shades
overlay2  = "#464e50"
overlay1  = "#464e50"
overlay0  = "#232a2d"
surface2  = "#232a2d"
surface1  = "#232a2d"
surface0  = "#141b1e"
base      = "#141b1e"
