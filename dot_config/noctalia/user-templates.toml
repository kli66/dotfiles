[templates.kde_noctalia_apply]
input_path = "~/.config/noctalia/templates/kde-noctalia-apply.state"
output_path = "~/.cache/noctalia/kde-noctalia-apply.state"
post_hook = "kwriteconfig6 --file ~/.local/share/color-schemes/noctalia.colors --group General --key ColorScheme noctalia && /etc/xdg/quickshell/noctalia-shell/Scripts/python/src/theming/kde-apply-scheme.py noctalia"
