# Disable Bluetooth headset-profile auto-switching.
#
# Why: quickshell (noctalia-shell) has a use-after-free in its PipeWire
# default-device tracker — PwDefaultTracker::setDefaultConfiguredSink calls
# QObject::disconnect() on an already-freed PwNode. Changing the default
# microphone away from a connected BT headset makes WirePlumber renegotiate
# the BT profile (HSP/HFP -> A2DP), which tears down and recreates the BT
# *sink* node mid-callback, leaving that dangling pointer -> SIGSEGV.
# Upstream: quickshell-mirror/quickshell #568 (dup #716). Not fixable in QML.
#
# Disabling autoswitch removes the trigger: WirePlumber no longer flips the BT
# profile on source changes, so the sink node is never torn down underneath
# the tracker. Trade-off: the BT headset mic no longer auto-engages when an app
# wants input — select the Headset/HSP profile manually if you need the BT mic.
#
# WirePlumber 0.5 syntax: the value lives under `wireplumber.settings`
# (the shipped `wireplumber.settings.schema` block only declares defaults).

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
